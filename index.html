<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Editor 3D Lavaderos Comunitarios - Mueve y acomoda los elementos</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #controls-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(30,30,40,0.85);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 15px;
            color: white;
            z-index: 20;
            width: 260px;
            border: 1px solid rgba(255,215,120,0.5);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            pointer-events: auto;
            font-size: 13px;
        }
        #controls-panel h3 {
            margin: 0 0 8px 0;
            font-size: 1rem;
            text-align: center;
            color: #ffcd7e;
        }
        .control-group {
            margin-bottom: 12px;
            border-top: 1px solid #555;
            padding-top: 8px;
        }
        .control-group label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 4px;
            color: #ddd;
        }
        select, input {
            width: 100%;
            padding: 6px;
            border-radius: 8px;
            border: none;
            background: #2c2c34;
            color: white;
            font-size: 0.8rem;
            margin-bottom: 8px;
        }
        .coord-group {
            display: flex;
            gap: 8px;
        }
        .coord-group input {
            width: 33%;
            text-align: center;
        }
        button {
            background: #f0a34b;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
            color: #2d2d2d;
            transition: 0.2s;
        }
        button:hover {
            background: #ffb86b;
            transform: scale(1.02);
        }
        .selected-info {
            background: #00000066;
            border-radius: 8px;
            padding: 6px;
            text-align: center;
            font-size: 0.7rem;
            margin-bottom: 8px;
            color: #ffd966;
        }
        hr {
            border-color: #555;
            margin: 8px 0;
        }
        .note {
            font-size: 0.65rem;
            text-align: center;
            margin-top: 8px;
            color: #ccc;
        }
        @media (max-width: 700px) {
            #controls-panel { width: 240px; padding: 10px; top: 10px; right: 10px; }
            .coord-group input { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <div id="controls-panel">
        <h3>🛠️ EDITOR INTERACTIVO</h3>
        <div class="selected-info" id="selectedName">Selecciona un elemento</div>
        <div class="control-group">
            <label>📌 Elemento</label>
            <select id="elementSelect"></select>
        </div>
        <div class="control-group">
            <label>📍 Posición (X, Y, Z) - metros</label>
            <div class="coord-group">
                <input type="number" id="posX" step="0.05" placeholder="X">
                <input type="number" id="posY" step="0.05" placeholder="Y">
                <input type="number" id="posZ" step="0.05" placeholder="Z">
            </div>
        </div>
        <div class="control-group">
            <label>🔄 Rotación (Y-axis, grados)</label>
            <input type="number" id="rotY" step="5" placeholder="Grados">
        </div>
        <button id="applyBtn">📐 Aplicar cambios</button>
        <hr>
        <button id="resetPosBtn">⟳ Restablecer posiciones originales</button>
        <div class="note">💡 Haz clic en cualquier elemento para seleccionarlo.<br>Arrastra con ratón para orbitar | Botón derecho para mover vista</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- INICIALIZACIÓN ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f1e2c);
        scene.fog = new THREE.FogExp2(0x0f1e2c, 0.008);

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(7, 5, 9);
        camera.lookAt(3, 1.5, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 1.0;
        controls.zoomSpeed = 1.2;
        controls.panSpeed = 0.8;
        controls.target.set(3, 1.5, 3.5);

        // --- ILUMINACIÓN ---
        const ambient = new THREE.AmbientLight(0x4a5a6a);
        scene.add(ambient);
        const mainLight = new THREE.DirectionalLight(0xfff5e0, 1.2);
        mainLight.position.set(5, 10, 4);
        mainLight.castShadow = true;
        mainLight.receiveShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 18;
        scene.add(mainLight);
        const fillLight = new THREE.PointLight(0xccaa77, 0.45);
        fillLight.position.set(2, 2, 2);
        scene.add(fillLight);
        const backLight = new THREE.PointLight(0x6688aa, 0.3);
        backLight.position.set(1, 3, -3);
        scene.add(backLight);
        
        // Helper suelo
        const gridHelper = new THREE.GridHelper(14, 20, 0xaa9977, 0x776644);
        gridHelper.position.y = -0.05;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.35;
        scene.add(gridHelper);
        
        // --- TERRENO FIJO (triángulo isósceles) ---
        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.lineTo(6, 0);
        shape.lineTo(3, 7.416);
        shape.closePath();
        const extrudeSettings = { steps: 1, depth: 0.1, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05 };
        const terrainGeom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        terrainGeom.rotateX(-Math.PI / 2);
        terrainGeom.translate(0, -0.05, 0);
        const terrainMat = new THREE.MeshStandardMaterial({ color: 0xd4c8a0, roughness: 0.7 });
        const terrainMesh = new THREE.Mesh(terrainGeom, terrainMat);
        terrainMesh.receiveShadow = true;
        scene.add(terrainMesh);
        
        // Borde triangular decorativo
        const borderPoints = [
            new THREE.Vector3(0, 0.02, 0), new THREE.Vector3(6, 0.02, 0),
            new THREE.Vector3(3, 0.02, 7.416), new THREE.Vector3(0, 0.02, 0)
        ];
        const borderLine = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(borderPoints), new THREE.LineBasicMaterial({ color: 0xffaa66 }));
        scene.add(borderLine);
        
        // --- CLASE PARA ELEMENTOS MÓVILES ---
        class MovableItem {
            constructor(obj, labelObj, defaultPos, defaultRot, name, type) {
                this.obj = obj;
                this.label = labelObj;
                this.defaultPos = defaultPos.clone();
                this.defaultRot = defaultRot;
                this.name = name;
                this.type = type;
                this.obj.userData = { movable: true, itemRef: this };
                if (this.label) this.label.userData = { movable: true, itemRef: this };
                this.setPosition(defaultPos.x, defaultPos.y, defaultPos.z);
                this.setRotation(defaultRot);
            }
            setPosition(x, y, z) {
                this.obj.position.set(x, y, z);
                if (this.label) this.label.position.set(x, y + 0.15, z);
            }
            setRotation(degY) {
                this.obj.rotation.y = degY * Math.PI / 180;
                this.currentRotY = degY;
            }
            reset() {
                this.setPosition(this.defaultPos.x, this.defaultPos.y, this.defaultPos.z);
                this.setRotation(this.defaultRot);
            }
            getPos() { return this.obj.position; }
            getRotY() { return this.currentRotY; }
        }
        
        // --- FUNCIÓN PARA CREAR ETIQUETAS CSS2D ---
        function makeLabel(text, color, offsetY = 0.8, bgOpacity = 0.7) {
            const div = document.createElement('div');
            div.textContent = text;
            div.style.color = color;
            div.style.fontSize = '0.7rem';
            div.style.fontWeight = 'bold';
            div.style.backgroundColor = `rgba(0,0,0,${bgOpacity})`;
            div.style.padding = '2px 8px';
            div.style.borderRadius = '20px';
            div.style.borderLeft = `3px solid ${color}`;
            div.style.fontFamily = 'monospace';
            div.style.whiteSpace = 'nowrap';
            const label = new CSS2DObject(div);
            return label;
        }
        
        // --- CREAR ELEMENTOS ---
        // 1. Caseta de agua (2x1.5x2.2)
        const casetaW = 2.0, casetaD = 1.5, casetaH = 2.2;
        const casetaGeom = new THREE.BoxGeometry(casetaW, casetaH, casetaD);
        const casetaMat = new THREE.MeshStandardMaterial({ color: 0xbc9a6c, roughness: 0.4 });
        const casetaMesh = new THREE.Mesh(casetaGeom, casetaMat);
        casetaMesh.castShadow = true;
        casetaMesh.receiveShadow = true;
        scene.add(casetaMesh);
        const casetaLabel = makeLabel('🏠 Caseta agua 2.00x1.50m', '#ffdd99');
        scene.add(casetaLabel);
        // Techo
        const roofGeom = new THREE.CylinderGeometry(1.15, 1.15, 0.25, 4);
        const roofMat = new THREE.MeshStandardMaterial({ color: 0xaa7c4a });
        const roof = new THREE.Mesh(roofGeom, roofMat);
        roof.castShadow = true;
        casetaMesh.add(roof);
        roof.position.set(0, casetaH/2 + 0.1, 0);
        
        // 2. Lavaderos (2 unidades lado izquierdo)
        const lavW = 0.70, lavD = 0.55, lavH = 0.80;
        const lavMaterial = new THREE.MeshStandardMaterial({ color: 0x8cb36b, roughness: 0.3 });
        const lavInteriorMat = new THREE.MeshStandardMaterial({ color: 0xcad2b0 });
        
        function createLavadero(x, z, id) {
            const group = new THREE.Group();
            const body = new THREE.BoxGeometry(lavW, lavH, lavD);
            const meshBody = new THREE.Mesh(body, lavMaterial);
            meshBody.position.y = lavH/2;
            meshBody.castShadow = true;
            group.add(meshBody);
            const interior = new THREE.BoxGeometry(lavW - 0.12, 0.22, lavD - 0.12);
            const intMesh = new THREE.Mesh(interior, lavInteriorMat);
            intMesh.position.y = lavH - 0.09;
            group.add(intMesh);
            const grifoGeom = new THREE.CylinderGeometry(0.05, 0.07, 0.2, 6);
            const grifoMat = new THREE.MeshStandardMaterial({ color: 0xddbb88 });
            const grifo = new THREE.Mesh(grifoGeom, grifoMat);
            grifo.position.set(-0.2, lavH - 0.05, 0.22);
            group.add(grifo);
            group.position.set(x, 0, z);
            scene.add(group);
            const label = makeLabel(`🧼 Lavadero ${id} 0.70x0.55m`, '#ccffaa', 0.9);
            scene.add(label);
            return { group, label };
        }
        
        const lav1 = createLavadero(0.35, 0.25, 'A');
        const lav2 = createLavadero(1.15, 0.25, 'B');
        
        // 3. Entrada/Salida (postes + dintel)
        const entradaGroup = new THREE.Group();
        const postMat = new THREE.MeshStandardMaterial({ color: 0xc29b5a });
        const postGeom = new THREE.BoxGeometry(0.12, 1.2, 0.12);
        const leftPost = new THREE.Mesh(postGeom, postMat);
        const rightPost = new THREE.Mesh(postGeom, postMat);
        leftPost.position.set(-0.5, 0.6, 0);
        rightPost.position.set(0.5, 0.6, 0);
        const lintelGeom = new THREE.BoxGeometry(1.1, 0.1, 0.2);
        const lintel = new THREE.Mesh(lintelGeom, new THREE.MeshStandardMaterial({ color: 0xb87c3a }));
        lintel.position.set(0, 1.15, 0);
        entradaGroup.add(leftPost, rightPost, lintel);
        scene.add(entradaGroup);
        const entradaLabel = makeLabel('🚪 Entrada/Salida 1.00m', '#ffcc77', 1.0);
        scene.add(entradaLabel);
        
        // 4. Indicador pasillo central (linea y flecha)
        const linePoints = [new THREE.Vector3(0, 0, 0.8), new THREE.Vector3(0, 0, 3.5), new THREE.Vector3(0, 0, 5.2)];
        const lineGeom = new THREE.BufferGeometry().setFromPoints(linePoints);
        const lineMatPas = new THREE.LineBasicMaterial({ color: 0xffaa55 });
        const centralLine = new THREE.Line(lineGeom, lineMatPas);
        scene.add(centralLine);
        const arrowCone = new THREE.ConeGeometry(0.12, 0.35, 8);
        const arrowMat = new THREE.MeshStandardMaterial({ color: 0xeeaa55 });
        const arrow = new THREE.Mesh(arrowCone, arrowMat);
        arrow.position.set(0, 0.2, 5.4);
        arrow.rotation.x = 0.2;
        scene.add(arrow);
        const pasilloLabel = makeLabel('⬅️ Pasillo central ➡️', '#ffe0aa', 0.8);
        scene.add(pasilloLabel);
        
        // --- INICIALIZAR ITEMS MÓVILES ---
        const movableItems = [];
        
        const casetaItem = new MovableItem(casetaMesh, casetaLabel, new THREE.Vector3(3, 1.1, 0.75), 0, "Caseta de agua", "building");
        movableItems.push(casetaItem);
        
        const lav1Item = new MovableItem(lav1.group, lav1.label, new THREE.Vector3(0.35, 0.4, 0.25), 0, "Lavadero A (izquierdo)", "lavadero");
        const lav2Item = new MovableItem(lav2.group, lav2.label, new THREE.Vector3(1.15, 0.4, 0.25), 0, "Lavadero B (izquierdo)", "lavadero");
        movableItems.push(lav1Item, lav2Item);
        
        const entradaItem = new MovableItem(entradaGroup, entradaLabel, new THREE.Vector3(3, 0, 7.416), 0, "Entrada/Salida", "entrada");
        movableItems.push(entradaItem);
        
        const pasilloLineItem = new MovableItem(centralLine, null, new THREE.Vector3(3, 0.08, 3), 0, "Línea pasillo (referencia)", "line");
        // Las flechas y labels auxiliares no son totalmente movibles individualmente, pero movemos el grupo del pasillo? simplificamos: solo mover linea central y flecha como grupo visual.
        const arrowItem = new MovableItem(arrow, null, new THREE.Vector3(3, 0.2, 5.4), 0, "Flecha pasillo", "arrow");
        const pasilloLabelItem = new MovableItem(pasilloLabel, null, new THREE.Vector3(3, 0.9, 3.2), 0, "Texto pasillo", "label");
        movableItems.push(pasilloLineItem, arrowItem, pasilloLabelItem);
        
        // Actualizar posiciones iniciales de los items recién creados
        casetaItem.setPosition(3, 1.1, 0.75);
        lav1Item.setPosition(0.35, 0.4, 0.25);
        lav2Item.setPosition(1.15, 0.4, 0.25);
        entradaItem.setPosition(3, 0, 7.416);
        pasilloLineItem.setPosition(3, 0.08, 3);
        arrowItem.setPosition(3, 0.2, 5.4);
        pasilloLabelItem.setPosition(3, 0.9, 3.2);
        
        // Ajustar rotaciones por defecto
        casetaItem.setRotation(0);
        lav1Item.setRotation(0);
        lav2Item.setRotation(0);
        entradaItem.setRotation(0);
        pasilloLineItem.setRotation(0);
        arrowItem.setRotation(0);
        pasilloLabelItem.setRotation(0);
        
        // --- INTERACCIÓN: RAYCASTER PARA SELECCIONAR ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let selectedItem = null;
        
        function highlightItem(item, enable) {
            if (!item || !item.obj) return;
            if (enable) {
                item.obj.children.forEach(child => {
                    if (child.material) child.material.emissive = new THREE.Color(0x442200);
                });
                if (item.obj.material) item.obj.material.emissive = new THREE.Color(0x442200);
            } else {
                item.obj.children.forEach(child => {
                    if (child.material) child.material.emissive = new THREE.Color(0x000000);
                });
                if (item.obj.material) item.obj.material.emissive = new THREE.Color(0x000000);
            }
        }
        
        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const clickableObjects = [];
            movableItems.forEach(item => {
                if (item.obj) clickableObjects.push(item.obj);
                if (item.label) clickableObjects.push(item.label);
            });
            const intersects = raycaster.intersectObjects(clickableObjects, true);
            if (intersects.length > 0) {
                let found = null;
                for (let obj of intersects) {
                    let current = obj.object;
                    while (current) {
                        if (current.userData && current.userData.itemRef) {
                            found = current.userData.itemRef;
                            break;
                        }
                        current = current.parent;
                    }
                    if (found) break;
                }
                if (found && found !== selectedItem) {
                    if (selectedItem) highlightItem(selectedItem, false);
                    selectedItem = found;
                    highlightItem(selectedItem, true);
                    updateUIFromSelected();
                }
            } else {
                if (selectedItem) highlightItem(selectedItem, false);
                selectedItem = null;
                document.getElementById('selectedName').innerText = 'Ninguno seleccionado';
                document.getElementById('posX').value = '';
                document.getElementById('posY').value = '';
                document.getElementById('posZ').value = '';
                document.getElementById('rotY').value = '';
            }
        });
        
        function updateUIFromSelected() {
            if (!selectedItem) return;
            document.getElementById('selectedName').innerHTML = `✅ ${selectedItem.name}`;
            const pos = selectedItem.getPos();
            document.getElementById('posX').value = pos.x.toFixed(3);
            document.getElementById('posY').value = pos.y.toFixed(3);
            document.getElementById('posZ').value = pos.z.toFixed(3);
            document.getElementById('rotY').value = selectedItem.getRotY().toFixed(1);
        }
        
        // Aplicar cambios manualmente
        document.getElementById('applyBtn').addEventListener('click', () => {
            if (!selectedItem) return;
            const x = parseFloat(document.getElementById('posX').value);
            const y = parseFloat(document.getElementById('posY').value);
            const z = parseFloat(document.getElementById('posZ').value);
            const rot = parseFloat(document.getElementById('rotY').value);
            if (!isNaN(x) && !isNaN(y) && !isNaN(z)) selectedItem.setPosition(x, y, z);
            if (!isNaN(rot)) selectedItem.setRotation(rot);
            updateUIFromSelected();
        });
        
        document.getElementById('resetPosBtn').addEventListener('click', () => {
            movableItems.forEach(item => item.reset());
            if (selectedItem) updateUIFromSelected();
        });
        
        // Llenar selector de elementos
        const selectEl = document.getElementById('elementSelect');
        movableItems.forEach((item, idx) => {
            const option = document.createElement('option');
            option.value = idx;
            option.textContent = item.name;
            selectEl.appendChild(option);
        });
        selectEl.addEventListener('change', (e) => {
            const idx = parseInt(e.target.value);
            if (!isNaN(idx) && movableItems[idx]) {
                if (selectedItem) highlightItem(selectedItem, false);
                selectedItem = movableItems[idx];
                highlightItem(selectedItem, true);
                updateUIFromSelected();
            }
        });
        
        // --- ANIMACIÓN Y RENDER ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Mostrar ayuda inicial
        console.log('Editor 3D cargado - Haz clic en cualquier elemento (caseta, lavadero, entrada) para moverlo.');
    </script>
</body>
</html>
